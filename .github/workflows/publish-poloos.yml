name: Publish PoloOS OTA

on:
  push:
    branches: [ main ]
    paths:
      - 'build/release_request.json'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release request
        shell: pwsh
        run: |
          $req = Get-Content build/release_request.json -Raw | ConvertFrom-Json
          "POLOOS_VERSION=$($req.version)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POLOOS_NOTES=$($req.notes)" | Out-File -FilePath $env:GITHUB_ENV -Append
          dotnet --version

      - name: Stamp app version
        shell: pwsh
        run: |
          $path = 'src/PoloOS.PC/Views/MainWindow.axaml.cs'
          $text = Get-Content $path -Raw
          $replacement = 'private const string AppVersion = "' + $env:POLOOS_VERSION + '";'
          $text = [regex]::Replace($text, 'private const string AppVersion = "[^"]+";', $replacement)
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE $path), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish win-x64 self-contained
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'publish/PoloOS_win-x64'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish 'src/PoloOS.PC/PoloOS.PC.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $updaterOut = Join-Path $out 'updater'
          dotnet publish 'src/PoloOS.Updater/PoloOS.Updater.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o $updaterOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add lightweight YouTube player
        shell: pwsh
        run: |
          $cfg = Get-Content 'build/youtfast.json' -Raw | ConvertFrom-Json
          $temp = Join-Path $env:RUNNER_TEMP "youtfast-$($cfg.version).zip"
          $extract = Join-Path $env:RUNNER_TEMP "youtfast-$($cfg.version)"
          $youtube = Join-Path $env:GITHUB_WORKSPACE 'publish/PoloOS_win-x64/YouTube'
          New-Item -ItemType Directory -Force -Path $youtube | Out-Null
          Invoke-WebRequest -Uri $cfg.url -OutFile $temp
          $hash = (Get-FileHash -Algorithm SHA256 $temp).Hash
          if ($hash -ne $cfg.sha256) { throw "YouTFast SHA256 mismatch: $hash" }
          Expand-Archive -LiteralPath $temp -DestinationPath $extract -Force
          $root = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          Get-ChildItem -LiteralPath $root.FullName -Force | Copy-Item -Destination $youtube -Recurse -Force

          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp.exe' -OutFile (Join-Path $youtube 'yt-dlp.exe')
          $denoZip = Join-Path $env:RUNNER_TEMP 'deno-windows-x86_64.zip'
          $denoExtract = Join-Path $env:RUNNER_TEMP 'deno-windows-x86_64'
          Invoke-WebRequest -Uri 'https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-pc-windows-msvc.zip' -OutFile $denoZip
          Expand-Archive -LiteralPath $denoZip -DestinationPath $denoExtract -Force
          Copy-Item -LiteralPath (Join-Path $denoExtract 'deno.exe') -Destination (Join-Path $youtube 'deno.exe') -Force
          "YouTFast $($cfg.version), yt-dlp and Deno packaged in YouTube/" | Set-Content (Join-Path $youtube 'POLOOS-INTEGRATION.txt')

      - name: Add ChairPlay CarPlay receiver
        shell: pwsh
        run: |
          $cfg = Get-Content 'build/chairplay.json' -Raw | ConvertFrom-Json
          $temp = Join-Path $env:RUNNER_TEMP "chairplay-$($cfg.version).zip"
          $extract = Join-Path $env:RUNNER_TEMP "chairplay-$($cfg.version)"
          $carplay = Join-Path $env:GITHUB_WORKSPACE 'publish/PoloOS_win-x64/CarPlay'
          New-Item -ItemType Directory -Force -Path $carplay | Out-Null
          Invoke-WebRequest -Uri $cfg.url -OutFile $temp
          $hash = (Get-FileHash -Algorithm SHA256 $temp).Hash
          if ($hash -ne $cfg.sha256) { throw "ChairPlay SHA256 mismatch: $hash" }
          Expand-Archive -LiteralPath $temp -DestinationPath $extract -Force
          $root = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          Get-ChildItem -LiteralPath $root.FullName -Force | Copy-Item -Destination $carplay -Recurse -Force
          "ChairPlay $($cfg.version) packaged in CarPlay/" | Set-Content (Join-Path $carplay 'POLOOS-INTEGRATION.txt')

      - name: Package and hash
        shell: pwsh
        run: |
          $zipName = "PoloOS_$env:POLOOS_VERSION`_win-x64.zip"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/publish/PoloOS_win-x64/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash
          "POLOOS_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POLOOS_ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "POLOOS_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:POLOOS_VERSION"
          if (gh release view $tag 2>$null) {
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag $env:POLOOS_ZIP --title "PoloOS $tag" --notes "$env:POLOOS_NOTES"

      - name: Publish OTA manifest
        shell: pwsh
        run: |
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:POLOOS_VERSION/$env:POLOOS_ZIP_NAME"
          $manifest = [ordered]@{
            version = $env:POLOOS_VERSION
            packageUrl = $assetUrl
            sha256 = $env:POLOOS_SHA256
            notes = $env:POLOOS_NOTES
            mandatory = $false
          } | ConvertTo-Json
          New-Item -ItemType Directory -Force -Path api | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'api/version'), $manifest, (New-Object System.Text.UTF8Encoding($false)))
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'version.json'), $manifest, (New-Object System.Text.UTF8Encoding($false)))
          git config user.name 'PoloOS OTA Bot'
          git config user.email 'poloos-ota@users.noreply.github.com'
          git add api/version version.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish PoloOS v$env:POLOOS_VERSION OTA manifest"
            git push
          }
